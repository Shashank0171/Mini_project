name: ai_mobile_assistant
description: "AI Based Mobile Assistant for Visually Impaired Individuals"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.12.0

  # Text-to-Speech
  flutter_tts: ^4.2.0

  # Speech Recognition
  speech_to_text: ^7.0.0

  # Maps & Navigation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.2

  # HTTP
  http: ^1.4.0

  # Local Storage
  shared_preferences: ^2.5.3

  # OCR
  google_mlkit_text_recognition: ^0.14.0

  # Permissions
  permission_handler: ^11.4.0

  # Share (for SOS)
  share_plus: ^10.1.4

  # Phone calls
  url_launcher: ^6.2.0

  # State Management
  provider: ^6.1.5

  # Image Picker (for gallery option)
  image_picker: ^1.1.2

  # Path Provider
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
